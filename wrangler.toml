name = "flo-pouille"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# Fichiers du site (HTML, CSS, JS, icônes)
[assets]
directory = "./public"

# Base de données : remplace database_id par l'identifiant de ta base D1
# (Cloudflare > Storage & Databases > D1 > ta base > Database ID)
[[d1_databases]]
binding = "DB"
database_name = "flo-pouille"
database_id = "3191dbdb-2642-4eb1-9fbb-7dfe8893fef1"

# Vérification des échéances chaque minute
[triggers]
crons = ["* * * * *"]

[vars]
# Contact exigé par les services de notification (Apple, Google)
VAPID_SUBJECT = "mailto:didier.varin@gmail.com"

[observability]
enabled = true
